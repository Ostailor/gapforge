[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapforge"
version = "0.6.0"
description = "A Codex-powered Research Ideation OS for finding experiment-ready research gaps."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GapForge" }]
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
gapforge = "gapforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/gapforge"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
